<vk-page id="1-hook">
  <vk-stack gap="wide">
    <vk-label counter="1 / 6">优化</vk-label>
    <vk-text size="headline">一行 <em>a + b</em>，编译出几条指令？</vk-text>
    <vk-text size="body" ink="secondary">不开优化：7 条。开了 -O2：3 条。差的那 4 条，是编译器在替省。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="2-source">
  <vk-stack gap="normal">
    <vk-label counter="2 / 6">源码</vk-label>
    <vk-text size="subhead">就这么三行。</vk-text>
    <vk-code lang="c" file="sum.c" src="../code/opt/sum.c" lines="1-3" current="2"></vk-code>
    <vk-text size="caption" ink="muted">这一块是从 code/opt/sum.c 读出来的。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="3-o0">
  <vk-stack gap="close">
    <vk-label counter="3 / 6">-O0</vk-label>
    <vk-text size="subhead">不优化：先摆好<em>栈帧</em>，再算。</vk-text>
    <vk-asm file="add-o0.dis" src="../code/opt/add-o0.dis" size="caption" current="6"></vk-asm>
  </vk-stack>
</vk-page>

<vk-page id="4-o2">
  <vk-stack gap="close">
    <vk-label counter="4 / 6">-O2</vk-label>
    <vk-text size="subhead">开了优化：栈帧<em>整个不要了</em>。</vk-text>
    <vk-asm file="add-o2.dis" src="../code/opt/add-o2.dis" size="caption" current="2"></vk-asm>
  </vk-stack>
</vk-page>

<vk-page id="5-count">
  <vk-stack gap="normal">
    <vk-label counter="5 / 6">数一数</vk-label>
    <vk-text size="subhead">同一个函数，<em>7 条对 3 条</em>。</vk-text>
    <vk-bars max="8" unit="条指令">
      <li value="7" label="add · -O0"></li>
      <li value="3" label="add · -O2" tone="ok"></li>
    </vk-bars>
    <vk-text size="caption" ink="muted">省掉的是 push ebp / mov esp,ebp / pop ebp 这些"进出栈"的固定开销。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="6-end">
  <vk-stack gap="wide">
    <vk-label counter="6 / 6">小结</vk-label>
    <vk-text size="display">优化，<br>先省<em>不必要的事</em>。</vk-text>
    <vk-text size="caption" ink="muted">下一集：为什么 -O2 有时反而更慢。</vk-text>
  </vk-stack>
</vk-page>
