name: Bug report
description: 元件、构建或展示站出了问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先跑 `npm run verify` 与 `npm run lint`，确认不是生成物过期。安全问题请走私密公告（见 SECURITY.md）。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 页面路径 / 标签 / 属性，越具体越好
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 一段 HTML，或“打开 _site/specimen/vk-xxx.html → 改某属性”
      render: html
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / Node 22 / Edge 140
    validations:
      required: true
