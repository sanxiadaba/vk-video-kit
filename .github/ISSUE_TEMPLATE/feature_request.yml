name: Feature request
description: 新标签、新属性或展示站改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的画面问题
      description: 不要从“加一个属性”开始；先说作者现在做不到什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议
      description: 如果涉及新标签，说明它属于 L1–L4 哪一层、和现有标签的边界
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代
      description: 现在用组合 / 一次性 CSS 能不能做到？为什么不够
