name: ci

on:
  # 全量 Windows 套件很贵（Windows runner 按 2 倍计费）。
  # 正常推送由 Pages 的 Linux 检查覆盖；需要像素/粗签名时手动跑这一条。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 测试里包含「像素与 DOM 对齐」和粗签名回归，都在 Windows 上生成的；
    # 换到 Linux 跑会因为字形度量不同而误报，所以 CI 跟着开发环境走。
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/AppData/Local/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm test
