name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 测试里包含「像素与 DOM 对齐」和粗签名回归，都在 Windows 上生成的；
    # 换到 Linux 跑会因为字形度量不同而误报，所以 CI 跟着开发环境走。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
