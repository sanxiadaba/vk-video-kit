<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>vk · 配方 目录</title>
<link rel="stylesheet" href="../../vk/fonts.css">
<link rel="stylesheet" href="../../vk/vk.css">
<link rel="stylesheet" href="recipes.css">
</head>
<body class="r-doc">
<vk-page align="top">
  <vk-stack gap="2xs">
    <div class="r-title r-title--subhead">
      <p class="r-eyebrow">配方册</p>
      <h2 class="r-title-main">一个东西，一种写法</h2>
    </div>
    <vk-rule variant="strong"></vk-rule>
    <vk-stack gap="sm">
      <vk-stack direction="row" gap="sm" align="baseline">
        <vk-text size="body">指标</vk-text>
        <vk-text size="label" ink="muted" data-meta>原 vk-stat → stat.html</vk-text>
      </vk-stack>
      <vk-stack direction="row" gap="sm" align="baseline">
        <vk-text size="body">标题三件套</vk-text>
        <vk-text size="label" ink="muted" data-meta>原 vk-title → title.html</vk-text>
      </vk-stack>
      <vk-stack direction="row" gap="sm" align="baseline">
        <vk-text size="body">引文</vk-text>
        <vk-text size="label" ink="muted" data-meta>原 vk-quote → quote.html</vk-text>
      </vk-stack>
      <vk-stack direction="row" gap="sm" align="baseline">
        <vk-text size="body">图与行内小件</vk-text>
        <vk-text size="label" ink="muted" data-meta>原 vk-figure / vk-tag / vk-mark → figure.html</vk-text>
      </vk-stack>
    </vk-stack>
  </vk-stack>
</vk-page>
<script src="../../dist/vk.js"></script>
</body>
</html>
