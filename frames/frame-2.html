<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>vk · Frame 2</title>
<link rel="stylesheet" href="../vk/fonts.css">
<link rel="stylesheet" href="../vk/vk.css">
<style>
  html, body { margin: 0; height: 100%; background: #e9eef5; overflow: hidden; }
  body { display: grid; place-items: center; min-height: 100vh; }
  vk-page { width: min(100vw, calc(100vh * 16 / 9)); max-height: 100vh; }
</style>
</head>
<body>
<vk-page align="center">
  <vk-stack gap="md">
    <vk-title index="03" eyebrow="对比 · 边界" size="title">改一行，<br><em>差在哪</em>要看得见。</vk-title>
    <vk-row gap="xl" align="top">
      <vk-diff w="1100" lang="c" file="bounds.c" src="../code/real.diff">

</vk-diff>
      <vk-box w="500" surface="none">
        <vk-table variant="ledger">
          <table>
            <thead><tr><th>版本</th><th align="right">i &lt;= 3</th></tr></thead>
            <tbody>
              <tr><td>改前</td><td align="right">读到 a[3]</td></tr>
              <tr data-em><td>改后</td><td align="right">只到 a[2]</td></tr>
            </tbody>
          </table>
        </vk-table>
      </vk-box>
    </vk-row>
  </vk-stack>
</vk-page>
<script src="../dist/vk.js"></script>
<script>window.vk.ready();</script>
</body>
</html>
