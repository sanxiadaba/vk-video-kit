<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>vk · Frame 0</title>
<link rel="stylesheet" href="../vk/fonts.css">
<link rel="stylesheet" href="../vk/vk.css">
<style>
  html, body { margin: 0; height: 100%; background: #e9eef5; overflow: hidden; }
  body { display: grid; place-items: center; min-height: 100vh; }
  vk-page { width: min(100vw, calc(100vh * 16 / 9)); max-height: 100vh; }
</style>
</head>
<body>

<!-- Frame 0：title + code + table + edge。M0 的「合」样本。 -->
<vk-page align="center">
  <vk-canvas w="1680" h="846">
    <vk-box x="0" y="0" w="1260" surface="none">
      <vk-title index="01" eyebrow="数组 · 越界" size="title">数组不是指针，<br><em>越界</em>才是问题。</vk-title>
    </vk-box>

    <vk-code id="code" x="0" y="326" w="1180" density="compact" lang="c" file="array.c" src="../code/array.c" lines="3-7" highlight="3">

</vk-code>

    <vk-box id="tbl" x="1300" y="326" w="380" surface="none">
      <vk-table variant="ledger" density="compact">
        <table>
          <thead>
            <tr><th>下标</th><th align="right">值</th></tr>
          </thead>
          <tbody>
            <tr><td>0</td><td align="right">1</td></tr>
            <tr><td>1</td><td align="right">2</td></tr>
            <tr><td>2</td><td align="right">3</td></tr>
            <tr data-em><td>3</td><td align="right">越界</td></tr>
          </tbody>
        </table>
      </vk-table>
    </vk-box>

    <vk-edge from="#code" to="#tbl" tone="err" arrow="end" dash></vk-edge>
  </vk-canvas>
</vk-page>

<script src="../dist/vk.js"></script>
<script>window.vk.ready();</script>
</body>
</html>
