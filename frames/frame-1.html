<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>vk · Frame 1</title>
<link rel="stylesheet" href="../vk/fonts.css">
<link rel="stylesheet" href="../vk/vk.css">
<style>
  html, body { margin: 0; height: 100%; background: #e9eef5; overflow: hidden; }
  body { display: grid; place-items: center; min-height: 100vh; }
  vk-page { width: min(100vw, calc(100vh * 16 / 9)); max-height: 100vh; }
</style>
</head>
<body>
<vk-page align="center">
  <vk-stack gap="lg">
    <vk-title index="02" eyebrow="终端 · 路由" size="title">先跑起来，<br>再看它<em>返回什么</em>。</vk-title>
    <vk-row gap="md" align="top">
      <vk-term w="1100" density="compact" lines="1-6" src="../code/hello.term" title="zsh" prompt="$">

</vk-term>
      <vk-box w="540" surface="none">
        <vk-callout tone="ok" size="label" title="路由返回 200">浏览器收到的是 HTML，不是函数。终端和页面是同一份字符串。</vk-callout>
      </vk-box>
    </vk-row>
  </vk-stack>
</vk-page>
<script src="../dist/vk.js"></script>
<script>window.vk.ready();</script>
</body>
