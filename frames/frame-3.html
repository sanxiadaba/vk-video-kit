<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>vk · Frame 3</title>
<link rel="stylesheet" href="../vk/fonts.css">
<link rel="stylesheet" href="../vk/vk.css">
<style>
  html, body { margin: 0; height: 100%; background: #e9eef5; overflow: hidden; }
  body { display: grid; place-items: center; min-height: 100vh; }
  vk-page { width: min(100vw, calc(100vh * 16 / 9)); max-height: 100vh; }
</style>
</head>
<body>
<vk-page align="center">
  <vk-stack gap="lg">
    <vk-title index="04" eyebrow="浏览器 · 图窗" size="title">页面是<em>一份字符串</em>，<br>图也一样。</vk-title>
    <vk-row gap="xl" align="top">
      <vk-browser w="960" url="http://127.0.0.1:5000/hello">
        <vk-stack gap="sm">
          <vk-text size="heading" weight="bold">Hello, C</vk-text>
          <vk-text size="label" emphasis="secondary">路由函数返回什么，浏览器就显示什么。</vk-text>
          <vk-row gap="sm" align="center">
            <vk-tag tone="ok">200 OK</vk-tag>
            <vk-text size="meta" mono emphasis="muted">text/html · 12 B</vk-text>
          </vk-row>
        </vk-stack>
      </vk-browser>
      <vk-box w="620" surface="none">
        <vk-figure w="620" fig="01" caption="一帧就是一张图。" ratio="16 / 9" src="../assets/img/sample.svg" alt="示例图"></vk-figure>
      </vk-box>
    </vk-row>
  </vk-stack>
</vk-page>
<script src="../dist/vk.js"></script>
<script>window.vk.ready();</script>
</body>
</html>
