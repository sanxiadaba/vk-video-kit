<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- 标题：这是一个数组，不是五个散字符 -->
  <text x="120" y="130" fill="#4B5563" font-family="'JetBrains Mono', monospace" font-size="72" letter-spacing="4">s = "hello"</text>
  <rect x="120" y="158" width="510" height="10" fill="#1B3FD6"/>

  <!-- 六个格子：值 / 下标 / 地址 -->
  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <g>
      <text x="220" y="260" fill="#5C6674" font-size="58">s[0]</text>
      <rect x="120" y="290" width="200" height="210" rx="12" fill="#F6F8FB" stroke="#C7D2DF" stroke-width="3"/>
      <text x="220" y="428" fill="#0B0F14" font-size="116">h</text>
      <text x="220" y="572" fill="#5C6674" font-size="58">0x7ffc</text>
    </g>
    <g>
      <text x="440" y="260" fill="#5C6674" font-size="58">s[1]</text>
      <rect x="340" y="290" width="200" height="210" rx="12" fill="#F6F8FB" stroke="#C7D2DF" stroke-width="3"/>
      <text x="440" y="428" fill="#0B0F14" font-size="116">e</text>
      <text x="440" y="572" fill="#5C6674" font-size="58">0x7ffd</text>
    </g>
    <g>
      <text x="660" y="260" fill="#5C6674" font-size="58">s[2]</text>
      <rect x="560" y="290" width="200" height="210" rx="12" fill="#F6F8FB" stroke="#C7D2DF" stroke-width="3"/>
      <text x="660" y="428" fill="#0B0F14" font-size="116">l</text>
      <text x="660" y="572" fill="#5C6674" font-size="58">0x7ffe</text>
    </g>
    <g>
      <text x="880" y="260" fill="#5C6674" font-size="58">s[3]</text>
      <rect x="780" y="290" width="200" height="210" rx="12" fill="#F6F8FB" stroke="#C7D2DF" stroke-width="3"/>
      <text x="880" y="428" fill="#0B0F14" font-size="116">l</text>
      <text x="880" y="572" fill="#5C6674" font-size="58">0x7fff</text>
    </g>
    <g>
      <text x="1100" y="260" fill="#5C6674" font-size="58">s[4]</text>
      <rect x="1000" y="290" width="200" height="210" rx="12" fill="#F6F8FB" stroke="#C7D2DF" stroke-width="3"/>
      <text x="1100" y="428" fill="#0B0F14" font-size="116">o</text>
      <text x="1100" y="572" fill="#5C6674" font-size="58">0x8000</text>
    </g>
    <g>
      <text x="1320" y="200" fill="#5C6674" font-size="52">终止符</text>
      <text x="1320" y="260" fill="#0B0F14" font-size="58">s[5]</text>
      <rect x="1220" y="290" width="200" height="210" rx="12" fill="#EEF2FE" stroke="#1B3FD6" stroke-width="3"/>
      <text x="1320" y="428" fill="#0B0F14" font-size="116">\0</text>
      <text x="1320" y="572" fill="#5C6674" font-size="52">0x8001</text>
    </g>
  </g>

  <!-- 一句话：六个字节，不是五个 -->
  <text x="120" y="740" fill="#333D4B" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="72">6 个字节，不是 5 个。</text>
  <text x="120" y="810" fill="#5C6674" font-family="'JetBrains Mono', monospace" font-size="58">strlen(s) == 5 · sizeof(s) == 6</text>
</svg>
