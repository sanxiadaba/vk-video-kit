<vk-page id="3-pair">

    <vk-text size="subhead">同一个循环，<em>一个顺、一个跳</em>。</vk-text>
    <vk-pair symbol="vs">
      <vk-code lang="c" file="a.c">
        <script type="text/plain" data-vk-source>
for (i = 0; i < n; i++)
    sum += a[i];
        </script>
      </vk-code>
      <vk-code lang="c" file="b.c">
        <script type="text/plain" data-vk-source>
for (i = 0; i < n; i++)
    sum += a[idx[i]];
        </script>
      </vk-code>
    </vk-pair>
  </vk-stack>
</vk-page>
