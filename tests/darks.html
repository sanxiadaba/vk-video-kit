<vk-page id="darkkit" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="20">深色页上的一整套件</vk-label>
    <vk-table variant="spec" size="caption">
      <table>
        <tr><th>层</th><th>延迟</th></tr>
        <tr><td>L1</td><td>1ns</td></tr>
        <tr><td>内存</td><td>100ns</td></tr>
      </table>
    </vk-table>
    <vk-cells cols="4" addr="0x1000" stride="4" current="2">
      <li label="a[0]">10</li>
      <li label="a[1]">20</li>
      <li label="a[2]">30</li>
      <li label="a[3]">40</li>
    </vk-cells>
    <vk-list variant="bullet" gap="close">
      <li>深色页上的清单</li>
      <li state="current">当前项</li>
    </vk-list>
  </vk-stack>
</vk-page>

<vk-page id="darkflow" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="1">深色页 · 流程与量</vk-label>
    <vk-steps current="2">
      <li>预处理</li>
      <li>编译</li>
      <li>链接</li>
    </vk-steps>
    <vk-bars max="30" unit="毫秒">
      <li value="5" label="数组" tone="ok"></li>
      <li value="23" label="链表" tone="err"></li>
    </vk-bars>
    <vk-timeline start="1963" end="2010" current="2">
      <li date="1963" label="ASCII"></li>
      <li date="1991" label="Unicode"></li>
      <li date="2010" label="Emoji"></li>
    </vk-timeline>
  </vk-stack>
</vk-page>

<vk-page id="darkdata" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="2">深色页 · 代码与数据</vk-label>
    <vk-diff file="d.diff">
      <script type="text/plain" data-vk-source>
--- a/x.c
+++ b/x.c
-int a = 1;
+int a = 2;
      </script>
    </vk-diff>
    <vk-bytes src="../code/http/head.bin" cols="8" current="1-3"></vk-bytes>
    <vk-bits value="0|01111111|011" label="float" index="down"></vk-bits>
  </vk-stack>
</vk-page>

<vk-page id="darkcall" surface="dark">
  <vk-stack gap="wide">
    <vk-label counter="1">深色页上的标注</vk-label>
    <vk-text id="a" size="body">这一行会被圈住</vk-text>
    <vk-text id="b" size="body">从这里指到那里</vk-text>
    <vk-text id="c" size="body">旁边挂一个注释</vk-text>
  </vk-stack>
  <vk-callout mode="ring" for="#a"></vk-callout>
  <vk-callout mode="arrow" from="#b" to="#c" shape="straight" tone="focus"></vk-callout>
  <vk-callout mode="note" for="#c" side="bottom">深色页上的注释</vk-callout>
  <vk-callout mode="badge" for="#b">1</vk-callout>
</vk-page>

<vk-page id="darksem" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="1">深色页 · 语义色</vk-label>
    <vk-list variant="check" gap="close">
      <li>勾选是绿的</li>
      <li state="current">当前项是蓝的</li>
    </vk-list>
    <vk-diff file="d.diff">
      <script type="text/plain" data-vk-source>
--- a/x.c
+++ b/x.c
-int a = 1;
+int a = 2;
      </script>
    </vk-diff>
    <vk-grid cols="12" gap="close">
      <vk-box span="4" tone="ok" pad="close"><vk-text size="caption">ok</vk-text></vk-box>
      <vk-box span="4" tone="warn" pad="close"><vk-text size="caption">warn</vk-text></vk-box>
      <vk-box span="4" tone="err" pad="close"><vk-text size="caption">err</vk-text></vk-box>
    </vk-grid>
  </vk-stack>
</vk-page>


<vk-page id="darkmedia" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="6">深色页 · 图与公式</vk-label>
    <vk-math size="subhead">\int_0^1 x^2\,dx = \frac{1}{3}</vk-math>
    <vk-img src="../assets/hello/asm-o0.png" ratio="3 / 1" fill="contain" radius="md"></vk-img>
  </vk-stack>
</vk-page>
