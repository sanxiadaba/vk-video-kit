<vk-page id="callout-measure">
  <vk-head kicker="标注" lede="量的是同一条边到同一条边。">相邻两格，差 4 字节。</vk-head>
  <vk-board as="cells" id="cells" addr="0x1000" stride="4" cols="4">
    <li value="1" label="a[0]"></li>
    <li value="2" label="a[1]"></li>
    <li value="3" label="a[2]"></li>
    <li value="4" label="a[3]"></li>
  </vk-board>
  <vk-callout mode="measure" from="#cells@item:1" to="#cells@item:2" label="4 字节"></vk-callout>
</vk-page>
