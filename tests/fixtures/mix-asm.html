<vk-page id="mix-asm">
  <vk-head kicker="对照" size="subhead">同一个函数，两种优化。</vk-head>
  <vk-flow split="1 1" gap="wide" valign="start">
    <vk-code id="o0" as="asm" title="zero_O0" size="caption">
      <script type="text/plain" data-vk-source>
push %rbp
mov %rsp,%rbp
mov $0,%eax
      </script>
    </vk-code>
    <vk-code id="o2" as="asm" title="zero_O2" size="caption">
      <script type="text/plain" data-vk-source>
xor %eax,%eax
ret
      </script>
    </vk-code>
  </vk-flow>
  <vk-callout as="mark" target="#o0@line:3 #o2@line:1"></vk-callout>
</vk-page>
