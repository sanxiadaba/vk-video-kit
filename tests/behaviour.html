<!-- 行为页：不参与出图评审，只给测试脚本量「运行期到底做了没有」。 -->

<vk-page id="behave">
  <vk-head kicker="行为" size="subhead">运行期只做四件事。</vk-head>
  <vk-flow cols="5 7" gap="wide">
    <vk-code id="shrink" lang="c" title="long.c" chrome="dots" long="clip">
      <script type="text/plain" data-vk-source>
int very_long_variable_name = another_long_name + yet_another_name_here;
      </script>
    </vk-code>
    <vk-flow gap="close">
      <vk-text id="inline" size="body">行内 <code>a[i]</code> 与键位 <kbd>Ctrl</kbd></vk-text>
      <vk-text id="icon" icon="eye">图标行</vk-text>
    </vk-flow>
  </vk-flow>
</vk-page>

<vk-page id="behave-table">
  <vk-table id="numtable">
    <table>
      <tr><th>名字</th><th>大小</th></tr>
      <tr><td>数组</td><td>32 KB</td></tr>
      <tr><td>链表</td><td>16 GB</td></tr>
      <tr state="current"><td>内存</td><td>100 ns</td></tr>
    </table>
  </vk-table>
</vk-page>

<vk-page id="behave-graph">
  <vk-graph layout="row" edge="arrow">
    <li id="a" label="a"></li>
    <li id="b" label="b" after="a"></li>
    <li id="c" label="c" after="b"></li>
  </vk-graph>
  <vk-callout id="ring" mode="ring" for="#a"></vk-callout>
</vk-page>

<vk-page id="behave-dark" surface="dark">
  <vk-code id="paperwin" lang="c" surface="paper" title="paper.c" chrome="dots">
    <script type="text/plain" data-vk-source>
int a = 1;
    </script>
  </vk-code>
</vk-page>
