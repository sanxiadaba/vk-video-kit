<vk-page id="1-darkbox">
  <vk-stack gap="normal">
    <vk-label counter="1 / 4">浅色页里的深色块</vk-label>
    <vk-text size="subhead">纸面页上放一块<em>深色</em>牌子。</vk-text>
    <vk-box surface="dark" pad="normal">
      <vk-text size="body">深色块里的字应该变浅。</vk-text>
      <vk-text size="caption" ink="muted">次要文字也要跟着变。</vk-text>
    </vk-box>
    <vk-box surface="dark" pad="normal" tone="ok">
      <vk-text size="body">带语义色的深色块。</vk-text>
    </vk-box>
  </vk-stack>
</vk-page>

<vk-page id="2-deep" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="2 / 4">三层：深页 → 白卡 → 深块</vk-label>
    <vk-text size="subhead">外层深、中间白、内层又深。</vk-text>
    <vk-box surface="paper" pad="normal">
      <vk-text size="body">白卡上的字是深的。</vk-text>
      <vk-box surface="dark" pad="close">
        <vk-text size="body">深块里的字又该变浅。</vk-text>
      </vk-box>
    </vk-box>
  </vk-stack>
</vk-page>

<vk-page id="3-dark-light" surface="dark">
  <vk-stack gap="normal">
    <vk-label counter="3 / 4">深色页上的浅底件</vk-label>
    <vk-text size="subhead">深色页里放一张<em>白纸卡片</em>。</vk-text>
    <vk-box surface="paper" pad="normal">
      <vk-text size="body">卡片里的字应该是深色的，不能跟着深色页变白。</vk-text>
      <vk-text size="caption" ink="muted">次要文字也一样。</vk-text>
    </vk-box>
    <vk-text size="caption" ink="muted">卡片外面这行才该是浅色。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="4-word">
  <vk-stack gap="normal">
    <vk-label counter="4 / 4">圈住行里的一段字</vk-label>
    <vk-text size="subhead">只圈 <em>sum</em> 这几个字符。</vk-text>
    <vk-code id="c" lang="c" file="array.c" src="../code/adt/array.c" lines="10-14" current="3"></vk-code>
  </vk-stack>
  <vk-callout mode="ring" for="#c@word:13:sum" tone="focus"></vk-callout>
</vk-page>
