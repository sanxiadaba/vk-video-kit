<vk-page>
  <vk-stack gap="wide">
    <vk-label counter="1 / 3">堆栈</vk-label>
    <vk-text size="headline">函数调用，就是<em>一层层压栈</em></vk-text>
    <vk-grid cols="12" gap="wide">
      <vk-code span="7" id="f" lang="c" file="add.c" mark="push" current="3">
        <script type="text/plain" data-vk-source>
int add(int a, int b) {
  push a;
  push b;
  return pop();
}
        </script>
      </vk-code>
      <vk-stack span="5" gap="close">
        <vk-cells cols="1" addr="0x7ffe">
          <li value="b = 2" label="栈顶"></li>
          <li value="a = 1" label="栈底"></li>
        </vk-cells>
      </vk-stack>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="note" for="#f@line:2">后进先出</vk-callout>
</vk-page>
