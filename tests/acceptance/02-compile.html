<vk-page id="1-stages">
  <vk-stack gap="section">
    <vk-label counter="1 / 4">编译</vk-label>
    <vk-text size="headline">从 .c 到可执行文件，要过<em>四道工序</em></vk-text>
    <vk-steps current="2">
      <li>预处理</li>
      <li>编译</li>
      <li>汇编</li>
      <li>链接</li>
    </vk-steps>
  </vk-stack>
</vk-page>

<vk-page id="2-preprocess">
  <vk-stack gap="normal">
    <vk-label counter="2 / 4">预处理</vk-label>
    <vk-text size="subhead">预处理只改<em># 开头的行</em></vk-text>
    <vk-code lang="c" file="hello.c" current="1">
      <script type="text/plain" data-vk-source>
#include <stdio.h>
int main(void) { printf("hello\n"); }
      </script>
    </vk-code>
    <vk-code lang="c" file="hello.i" current="1">
      <script type="text/plain" data-vk-source>
int printf(const char *, ...);
int main(void) { printf("hello\n"); }
      </script>
    </vk-code>
    <vk-text size="caption" ink="muted">#include 被整段展开成一行声明；hello.i 里已经没有 # 了。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="3-compile">
  <vk-stack gap="wide">
    <vk-label counter="3 / 4">编译</vk-label>
    <vk-text size="subhead">一行 C 翻成<em>几条指令</em></vk-text>
    <vk-grid cols="12" gap="wide">
      <vk-code span="6" lang="c" file="hello.c" current="2">
        <script type="text/plain" data-vk-source>
int add(int a, int b) {
  return a + b;
}
        </script>
      </vk-code>
      <vk-asm span="6" file="add.s" current="3">
        <script type="text/plain" data-vk-source>
0000000000401136 <add>:
  401136:  89 7d fc              mov    %edi,-0x4(%rbp)
  401139:  8b 45 fc              mov    -0x4(%rbp),%eax
  40113c:  03 45 f8              add    -0x8(%rbp),%eax
  40113f:  c3                    ret
        </script>
      </vk-asm>
    </vk-grid>
  </vk-stack>
</vk-page>

<vk-page id="4-link">
  <vk-stack gap="wide">
    <vk-label counter="4 / 4">链接</vk-label>
    <vk-text size="subhead">链接器把几个 <em>.o</em> 拼成一个可执行文件。</vk-text>
    <vk-pair symbol="+">
      <vk-box surface="soft" pad="normal" title="main.o">
        <vk-text size="caption" ink="muted">main 的代码与调用</vk-text>
      </vk-box>
      <vk-box surface="soft" pad="normal" title="add.o">
        <vk-text size="caption" ink="muted">add 的代码</vk-text>
      </vk-box>
    </vk-pair>
    <vk-text size="caption" ink="muted">链接之后，调用地址才被填成真正的跳转目标。</vk-text>
  </vk-stack>
</vk-page>
