<vk-page id="1-rebase">
  <vk-stack gap="normal">
    <vk-label counter="1 / 4">Git</vk-label>
    <vk-pair symbol="vs">
      <vk-code lang="text" file="merge">
        <script type="text/plain" data-vk-source>
*   merge
|\\
| * feat
* | main
|/
* base
        </script>
      </vk-code>
      <vk-code lang="text" file="rebase">
        <script type="text/plain" data-vk-source>
* feat
* main
* base
        </script>
      </vk-code>
    </vk-pair>
    <vk-text size="caption" ink="muted">左边留下分叉，右边把提交重放成一条线。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="2-diff">
  <vk-stack gap="normal">
    <vk-label counter="2 / 4">改动</vk-label>
    <vk-text size="subhead">diff 只回答：<em>哪一行变了</em>。</vk-text>
    <vk-diff file="main.c">
      <script type="text/plain" data-vk-source>
diff --git a/main.c b/main.c
--- a/main.c
+++ b/main.c
@@ -1,3 +1,3 @@
-int main() {
+int main(void) {
   printf("hello\\n");
 }
      </script>
    </vk-diff>
  </vk-stack>
</vk-page>

<vk-page id="3-history">
  <vk-stack gap="normal">
    <vk-label counter="3 / 4">历史</vk-label>
    <vk-text size="subhead">每个点是一份<em>完整快照</em>，不是增量。</vk-text>
    <vk-timeline start="v0.1" end="v1.0">
      <li date="v0.1" label="能跑"></li>
      <li date="v0.5" label="能装"></li>
      <li date="v0.9" label="能测" state="current"></li>
      <li date="v1.0" label="能用"></li>
    </vk-timeline>
  </vk-stack>
</vk-page>

<vk-page id="4-files">
  <vk-stack gap="normal">
    <vk-label counter="4 / 4">工作区</vk-label>
    <vk-text size="subhead">改的是工作区，<em>提交的是索引</em>。</vk-text>
    <vk-grid cols="12" gap="wide">
      <vk-tree span="5" title="project" depth="2">
        <script type="text/plain" data-vk-tree>
{"name":"project","children":[{"name":"src","dir":true,"children":[{"name":"main.c"},{"name":"add.c"}]},{"name":".git","dir":true},{"name":"README.md"}]}
        </script>
      </vk-tree>
      <vk-list span="7" variant="ordered" gap="close">
        <li>git add —— 工作区 → 索引</li>
        <li>git commit —— 索引 → 仓库</li>
        <li state="current">git push —— 仓库 → 远端</li>
      </vk-list>
    </vk-grid>
  </vk-stack>
</vk-page>
