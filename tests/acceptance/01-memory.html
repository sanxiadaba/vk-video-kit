<vk-page id="1-intro">
  <vk-stack gap="wide">
    <vk-label counter="1 / 4">内存</vk-label>
    <vk-text size="headline">字符串不是值，是<em>一块内存</em></vk-text>
    <vk-grid cols="12" gap="wide">
      <vk-code span="7" id="intro-code" lang="c" file="hello.c" current="2">
        <script type="text/plain" data-vk-source>
char s[] = "hello";
s[0] = 'H';
printf("%s\n", s);
        </script>
      </vk-code>
      <vk-stack span="5" gap="close">
        <vk-cells cols="3" addr="0x1000">
          <li value="104" label="s[0]"></li>
          <li value="101" label="s[1]"></li>
          <li value="108" label="s[2]"></li>
        </vk-cells>
        <vk-text size="caption" ink="muted">每个字节一个地址：0x1000 起，一格一字节。</vk-text>
      </vk-stack>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="note" for="#intro-code@line:2">把 'H' 写进第一个字节</vk-callout>
</vk-page>

<vk-page id="2-index">
  <vk-stack gap="wide">
    <vk-label counter="2 / 4">下标</vk-label>
    <vk-text size="subhead">下标就是<em>偏移量</em>：s[2] 从 0x1000 走两步。</vk-text>
    <vk-grid cols="12" gap="wide">
      <vk-code span="6" id="idx-code" lang="c" file="hello.c" current="2">
        <script type="text/plain" data-vk-source>
char s[] = "hello";
char c = s[2];
        </script>
      </vk-code>
      <vk-cells span="6" id="idx-cells" cols="4" addr="0x1000">
        <li value="104" label="s[0]"></li>
        <li value="101" label="s[1]"></li>
        <li value="108" label="s[2]"></li>
        <li value="108" label="s[3]"></li>
      </vk-cells>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="ring" for="#idx-cells@cell:2"></vk-callout>
</vk-page>

<vk-page id="3-overflow">
  <vk-stack gap="wide">
    <vk-label counter="3 / 4">越界</vk-label>
    <vk-text size="subhead">越界不报错，它只是写坏了<em>别人的内存</em>。</vk-text>
    <vk-cells cols="8" addr="0x1000" current="7">
      <li value="104" label="s[0]"></li>
      <li value="101" label="s[1]"></li>
      <li value="108" label="s[2]"></li>
      <li value="108" label="s[3]"></li>
      <li value="111" label="s[4]"></li>
      <li value="0" label="s[5]"></li>
      <li value="240" label="?"></li>
      <li value="13" label="?"></li>
    </vk-cells>
    <vk-text size="body" ink="secondary">s[6] 已经不在这个字符串里了。编译器不会拦你，运行时也不会。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="4-pointer">
  <vk-stack gap="wide">
    <vk-label counter="4 / 4">指针</vk-label>
    <vk-text size="subhead">指针不存字符，它存<em>第一个字符的地址</em>。</vk-text>
    <vk-pair symbol="→">
      <vk-code lang="c" file="hello.c">
        <script type="text/plain" data-vk-source>
char *p = "hello";
        </script>
      </vk-code>
      <vk-stack gap="close">
        <vk-cells cols="2" addr="0x1000">
          <li value="104" label="h"></li>
          <li value="101" label="e"></li>
        </vk-cells>
        <vk-text size="caption" ink="muted">p 里存的是 0x1000，不是 "hello"。</vk-text>
      </vk-stack>
    </vk-pair>
  </vk-stack>
</vk-page>
