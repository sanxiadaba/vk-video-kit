<vk-page id="stack">
  <vk-stack gap="normal">
    <vk-label counter="1">stack</vk-label>
    <vk-text size="subhead">weights="1 2 1" 按份数分高；justify 管主轴。</vk-text>
    <vk-stack grow weights="1 2 1" gap="close" align="stretch">
      <vk-box surface="soft" pad="close"><vk-text size="caption">第一份</vk-text></vk-box>
      <vk-box surface="tint" tone="focus" pad="close"><vk-text size="caption">第二份（两倍高）</vk-text></vk-box>
      <vk-box surface="soft" pad="close"><vk-text size="caption">第三份</vk-text></vk-box>
    </vk-stack>
    <vk-stack direction="row" align="center" justify="between" gap="close">
      <vk-text size="caption" ink="muted">左</vk-text>
      <vk-text size="caption" ink="muted">中</vk-text>
      <vk-text size="caption" ink="muted">右</vk-text>
    </vk-stack>
  </vk-stack>
</vk-page>

<vk-page id="text">
  <vk-stack gap="close">
    <vk-label counter="2">text</vk-label>
    <vk-text size="body" measure="14">measure="14" 限制行长，一行到十四字就换行。</vk-text>
    <vk-text size="body" weight="medium" tone="focus">weight 与 tone 一起用。</vk-text>
    <vk-text size="body" icon="arrow-right">icon 在文字前面加图标。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="code">
  <vk-stack gap="close">
    <vk-code lang="c" file="bsearch.c" src="../code/bsearch/bsearch.c" size="caption" focus="4-6" fold="8-9" current="5"></vk-code>
  </vk-stack>
</vk-page>

<vk-page id="term">
  <vk-stack gap="close">
    <vk-label counter="4">term · dark</vk-label>
    <vk-term title="zsh" surface="dark" prompt="$" size="caption">
      <script type="text/plain" data-vk-source>
$ gcc -O2 sum.c -o sum
$ ./sum
49
      </script>
    </vk-term>
    <vk-text size="caption" ink="muted">surface="dark" 的终端：讲命令行时比白底更像现场。</vk-text>
  </vk-stack>
</vk-page>

<vk-page id="compare">
  <vk-stack gap="close">
    <vk-compare variant="stack" mark="10,10,80,30" labels="../assets/hello/o0.png,../assets/hello/o2.png|-O0|-O2"></vk-compare>
  </vk-stack>
</vk-page>

<vk-page id="callout">
  <vk-stack gap="normal">
    <vk-label counter="6">callout</vk-label>
    <vk-code id="c1" lang="c" file="add.c" src="../code/opt/sum.c" lines="1-3" size="caption" current="2"></vk-code>
    <vk-text size="caption" ink="muted">注释可以指定方向、留白和颜色。</vk-text>
  </vk-stack>
  <vk-callout mode="ring" for="#c1@line:2" side="left" gap="close" tone="warn"></vk-callout>
</vk-page>

<vk-page id="misc">
  <vk-stack gap="normal">
    <vk-label counter="7">其他</vk-label>
    <vk-grid cols="12" gap="close">
      <vk-bars span="6" max="8" unit="条">
        <li value="3" label="蓝" tone="focus"></li>
        <li value="6" label="绿" tone="ok"></li>
        <li value="2" label="红" tone="err"></li>
      </vk-bars>
      <vk-cells span="6" cols="2" size="caption" addr="0x1000">
        <li value="104" label="h"></li>
        <li value="105" label="e"></li>
        <li value="73" label="I" state="current"></li>
        <li value="0" label="可写"></li>
      </vk-cells>
    </vk-grid>
    <vk-steps connector="line">
      <li>一</li>
      <li>二</li>
      <li>三</li>
    </vk-steps>
    <vk-list variant="ordered" size="caption" gap="close">
      <li>有序列表，size 收小一号</li>
      <li>两行就够</li>
    </vk-list>
  </vk-stack>
</vk-page>
