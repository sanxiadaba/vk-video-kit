<vk-page id="arrows">
  <vk-stack gap="normal">
    <vk-label counter="1">arrow · straight / ortho</vk-label>
    <vk-text size="subhead">同一行用直线；高低错开用直角。</vk-text>
    <vk-canvas w="1500" h="300" pad="close">
      <vk-box id="a1" x="0" y="0" w="380" h="120" surface="soft" pad="normal"><vk-text size="caption">源</vk-text></vk-box>
      <vk-box id="a2" x="560" y="0" w="380" h="120" surface="soft" pad="normal"><vk-text size="caption">同高</vk-text></vk-box>
      <vk-box id="a3" x="1120" y="170" w="380" h="120" surface="tint" tone="focus" pad="normal"><vk-text size="caption">错开</vk-text></vk-box>
    </vk-canvas>
  </vk-stack>
  <vk-callout mode="arrow" from="#a1" to="#a2" shape="straight"></vk-callout>
  <vk-callout mode="arrow" from="#a2" to="#a3" shape="ortho" tone="focus"></vk-callout>
</vk-page>

<vk-page id="sides">
  <vk-stack gap="none">
    <vk-label counter="2">note · 四边</vk-label>
    <vk-canvas w="1500" h="700" pad="close">
      <vk-box id="s1" x="700" y="120" w="300" h="100" surface="soft" pad="normal"><vk-text size="caption" align="center">上</vk-text></vk-box>
      <vk-box id="s2" x="900" y="320" w="300" h="100" surface="soft" pad="normal"><vk-text size="caption" align="center">右</vk-text></vk-box>
      <vk-box id="s3" x="700" y="520" w="300" h="100" surface="soft" pad="normal"><vk-text size="caption" align="center">下</vk-text></vk-box>
      <vk-box id="s4" x="420" y="320" w="300" h="100" surface="soft" pad="normal"><vk-text size="caption" align="center">左</vk-text></vk-box>
    </vk-canvas>
  </vk-stack>
  <vk-callout mode="note" for="#s1" side="top" gap="wide">上方</vk-callout>
  <vk-callout mode="note" for="#s2" side="right">右侧</vk-callout>
  <vk-callout mode="note" for="#s3" side="bottom">下方</vk-callout>
  <vk-callout mode="note" for="#s4" side="left">左侧</vk-callout>
</vk-page>

<vk-page id="ring">
  <vk-stack gap="normal">
    <vk-label counter="3">ring · badge</vk-label>
    <vk-code id="r1" lang="c" file="sum.c" src="../code/opt/sum.c" lines="1-3" size="caption" current="2"></vk-code>
    <vk-text size="caption" ink="muted">ring 圈住第 2 行；badge 是编号点。</vk-text>
  </vk-stack>
  <vk-callout mode="ring" for="#r1@line:2" tone="focus"></vk-callout>
  <vk-callout mode="badge" for="#r1@line:2">1</vk-callout>
</vk-page>

<vk-page id="far">
  <vk-stack gap="normal">
    <vk-label counter="4">远距离</vk-label>
    <vk-text size="subhead">跨半帧的两个点也要连起来。</vk-text>
    <vk-canvas w="1500" h="380" pad="close">
      <vk-box id="f1" x="0" y="0" w="420" h="120" surface="soft" pad="normal"><vk-text size="caption">左上</vk-text></vk-box>
      <vk-box id="f2" x="900" y="240" w="420" h="120" surface="tint" tone="focus" pad="normal"><vk-text size="caption">右下</vk-text></vk-box>
    </vk-canvas>
  </vk-stack>
  <vk-callout mode="arrow" from="#f1" to="#f2" shape="curve" tone="warn"></vk-callout>
</vk-page>

<vk-page id="anchors">
  <vk-stack gap="normal">
    <vk-label counter="5">锚点 · @part</vk-label>
    <vk-steps id="st" current="2" size="subhead">
      <li>一</li>
      <li>二</li>
      <li>三</li>
    </vk-steps>
    <vk-grid cols="12" gap="close">
      <vk-cells id="cl" span="4" cols="2" size="caption" addr="0x1000">
        <li value="1" label="a"></li>
        <li value="2" label="b"></li>
      </vk-cells>
      <vk-asm id="as" span="8" file="add-o0.dis" src="../code/opt/add-o0.dis" size="caption" lines="1-4"></vk-asm>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="badge" for="#st@step:1">1</vk-callout>
  <vk-callout mode="badge" for="#cl@cell:1" tone="ok">2</vk-callout>
  <vk-callout mode="badge" for="#as@addr:3" tone="focus">3</vk-callout>
</vk-page>
