<vk-page id="arrows">
  <vk-stack gap="normal">
    <vk-label counter="1">arrow · 三种形状</vk-label>
    <vk-grid cols="12" gap="wide">
      <vk-box id="a1" span="3" surface="soft" pad="normal"><vk-text size="caption" align="center">源</vk-text></vk-box>
      <vk-box id="a2" span="3" surface="soft" pad="normal"><vk-text size="caption" align="center">直</vk-text></vk-box>
      <vk-box id="a3" span="3" surface="soft" pad="normal"><vk-text size="caption" align="center">折</vk-text></vk-box>
    </vk-grid>
    <vk-text size="caption" ink="muted">straight 直连；ortho 走直角；curve 是默认的弧线。</vk-text>
  </vk-stack>
  <vk-callout mode="arrow" from="#a1" to="#a2" shape="straight"></vk-callout>
  <vk-callout mode="arrow" from="#a2" to="#a3" shape="ortho"></vk-callout>
</vk-page>

<vk-page id="notes">
  <vk-stack gap="normal">
    <vk-label counter="2">note · 四边</vk-label>
    <vk-grid cols="12" gap="section">
      <vk-box id="n1" span="4" surface="soft" pad="normal"><vk-text size="caption">左上目标</vk-text></vk-box>
      <vk-box id="n2" span="4" surface="soft" pad="normal"><vk-text size="caption">中</vk-text></vk-box>
      <vk-box id="n3" span="4" surface="soft" pad="normal"><vk-text size="caption">右</vk-text></vk-box>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="note" for="#n1" side="top">顶部注解</vk-callout>
  <vk-callout mode="note" for="#n2" side="bottom">底部注解，文字长一点也应当放得下</vk-callout>
  <vk-callout mode="note" for="#n3" side="left">左侧注解</vk-callout>
</vk-page>

<vk-page id="ring">
  <vk-stack gap="normal">
    <vk-label counter="3">ring · badge</vk-label>
    <vk-code id="r1" lang="c" file="sum.c" src="../code/opt/sum.c" lines="1-3" size="caption" current="2"></vk-code>
    <vk-text size="caption" ink="muted">ring 圈住第 2 行；badge 是编号点。</vk-text>
  </vk-stack>
  <vk-callout mode="ring" for="#r1@line:2" tone="focus"></vk-callout>
  <vk-callout mode="badge" for="#r1@line:2" side="right">1</vk-callout>
</vk-page>

<vk-page id="far">
  <vk-stack gap="normal">
    <vk-label counter="4">远距离</vk-label>
    <vk-text size="subhead">跨半帧的两个点也要连起来。</vk-text>
    <vk-grid cols="12" gap="section">
      <vk-box id="f1" span="3" surface="soft" pad="normal"><vk-text size="caption">上</vk-text></vk-box>
      <vk-box id="f2" span="3" surface="tint" tone="focus" pad="normal"><vk-text size="caption" align="center">下</vk-text></vk-box>
    </vk-grid>
  </vk-stack>
  <vk-callout mode="arrow" from="#f1" to="#f2" shape="curve" tone="warn"></vk-callout>
</vk-page>
